name: athenaeum_bookstore
description: Bookstore Literary Curation & Archival bookstore app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.0
  firebase_database: ^12.0.0
  firebase_messaging: ^16.0.4
  google_sign_in: ^6.2.2
  http: ^1.5.0
  flutter_local_notifications: 19.5.0
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.10.0
  image_picker: ^1.2.0
  google_fonts: ^6.3.0
  provider: ^6.1.5+1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand_logo/Brand Logo.png
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#171411"
  adaptive_icon_foreground: assets/brand_logo/Brand Logo.png